<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gilam Operator</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <!-- ═══ COMPONENT CONTAINERS ═════════════════════════════════════════ -->
  <!-- Komponentlar component-loader.js orqali avtomatik yuklanadi -->

  <div id="app-root"></div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toast-container"></div>

  <!-- AUDIO -->
  <audio id="ringtone" loop preload="auto">
    <source src="assets/ringtone.wav" type="audio/wav">
  </audio>

  <!-- ═══ MAP MODAL ═══════════════════════════════════════════════════ -->
  <div id="map-modal" class="map-modal" style="display:none;">
    <div class="map-modal-content">
      <div class="map-modal-header">
        <div class="map-modal-title">
          <span class="material-icons-round">location_on</span>
          <span>Lokatsiyani tanlang</span>
        </div>
        <button class="map-modal-close" id="map-modal-close">
          <span class="material-icons-round">close</span>
        </button>
      </div>
      <div id="map-container" class="map-container"></div>
      <div class="map-modal-footer">
        <div class="map-coords">
          <span class="material-icons-round">gps_fixed</span>
          <span id="map-coords-text">Xaritadan joy tanlang</span>
        </div>
        <div class="map-actions">
          <button class="btn-crm btn-crm-secondary" id="map-cancel">Bekor</button>
          <button class="btn-crm btn-crm-primary" id="map-confirm">
            <span class="material-icons-round">check</span> Tasdiqlash
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="chat-modal" style="display:none; position: fixed; right: 20px; bottom: 85px; width: 350px; height: 500px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 999999; flex-direction: column; overflow: hidden;">
    <div style="background: #1e293b; color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 8px;">
         <span class="material-icons-round">support_agent</span>
         <span style="font-weight: 600;">Haydovchilar bilan aloqa</span>
      </div>
      <button id="chat-close" style="background:none; border:none; color:white; cursor:pointer;"><span class="material-icons-round">close</span></button>
    </div>
    
    <div id="chat-drivers-list" style="display: flex; gap: 8px; padding: 8px 12px; background: #f1f5f9; overflow-x: auto; border-bottom: 1px solid #e2e8f0; min-height: 48px; align-items: center;">
       <span style="font-size: 11px; color: #64748b; white-space: nowrap;">Aktiv suhbatlar:</span>
    </div>

    <div id="chat-messages" style="flex: 1; padding: 16px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 8px;">
       <div style="align-self: center; font-size: 12px; color: #94a3b8; margin-top: auto; margin-bottom: auto; text-align: center;">Haydovchini yuqoridan tanlang yoki ularning yozishini kuting</div>
    </div>
    
    <div style="padding: 12px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 8px;">
      <input id="chat-input" type="text" placeholder="Xabar yozing..." disabled style="flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 20px; outline: none; font-family: 'Inter', sans-serif;">
      <button id="chat-send" disabled style="background: #94a3b8; color: white; border: none; width: 36px; height: 36px; border-radius: 18px; cursor: not-allowed; display: flex; justify-content: center; align-items: center;">
        <span class="material-icons-round" style="font-size: 18px;">send</span>
      </button>
    </div>
  </div>

  <button id="chat-fab" style="position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 28px; background: #10b981; color: white; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); z-index: 999999; display: flex; justify-content: center; align-items: center;">
    <span class="material-icons-round">chat</span>
  </button>

  <!-- ═══ SCRIPTS ══════════════════════════════════════════════════════ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="node_modules/socket.io-client/dist/socket.io.js"></script>
  <script src="src/js/component-loader.js"></script>
  <script src="src/js/utils.js"></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/ui.js"></script>
  <script src="src/js/sip-client.js"></script>
  <script src="src/js/crm.js"></script>
  <script src="src/js/settings.js"></script>
  <script src="src/js/chat.js"></script>
  <script src="src/js/app.js"></script>

</body>
</html>
