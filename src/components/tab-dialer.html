<!-- ═══ DIALER TAB ══════════════════════════════════════════════════════ -->
<div class="tab-content active" id="tab-dialer">
  <div class="dialer-layout">
    <!-- LEFT: Dialer -->
    <div class="dialer-panel">
      <!-- SIP Status -->
      <div class="sip-bar">
        <div class="sip-bar-left">
          <span id="sip-status-dot" class="sip-dot-inline offline"></span>
          <span id="sip-status-text">SIP Ulanmagan</span>
        </div>
        <span id="sip-extension-text" class="sip-ext">—</span>
      </div>

      <!-- Number Input -->
      <div class="dial-input-wrap">
        <input type="text" id="dial-number" class="dial-input" placeholder="Raqam kiriting" autocomplete="off" spellcheck="false">
        <button id="btn-clear-number" class="dial-clear" title="Tozalash">
          <span class="material-icons-round">backspace</span>
        </button>
      </div>

      <!-- Dialpad Grid -->
      <div class="dialpad">
        <button class="dial-key" data-key="1"><span class="dk-num">1</span></button>
        <button class="dial-key" data-key="2"><span class="dk-num">2</span><span class="dk-sub">ABC</span></button>
        <button class="dial-key" data-key="3"><span class="dk-num">3</span><span class="dk-sub">DEF</span></button>
        <button class="dial-key" data-key="4"><span class="dk-num">4</span><span class="dk-sub">GHI</span></button>
        <button class="dial-key" data-key="5"><span class="dk-num">5</span><span class="dk-sub">JKL</span></button>
        <button class="dial-key" data-key="6"><span class="dk-num">6</span><span class="dk-sub">MNO</span></button>
        <button class="dial-key" data-key="7"><span class="dk-num">7</span><span class="dk-sub">PQRS</span></button>
        <button class="dial-key" data-key="8"><span class="dk-num">8</span><span class="dk-sub">TUV</span></button>
        <button class="dial-key" data-key="9"><span class="dk-num">9</span><span class="dk-sub">WXYZ</span></button>
        <button class="dial-key" data-key="*"><span class="dk-num">✱</span></button>
        <button class="dial-key" data-key="0"><span class="dk-num">0</span><span class="dk-sub">+</span></button>
        <button class="dial-key" data-key="#"><span class="dk-num">#</span></button>
      </div>

      <!-- Call Button -->
      <div class="dial-actions">
        <button id="btn-call" class="btn-call" title="Qo'ng'iroq">
          <span class="material-icons-round">call</span>
        </button>
      </div>
    </div>

    <!-- RIGHT: CRM Panel -->
    <div class="crm-side">
      <!-- Active Campaign -->
      <div id="active-campaign-info" style="display:none;">
        <div class="campaign-badge"><span class="material-icons-round">campaign</span><span id="campaign-name-badge">—</span></div>
      </div>

      <!-- Customer Lookup -->
      <div id="customer-lookup" style="display:none;">
        <div class="customer-card">
          <div class="customer-avatar"><span class="material-icons-round">person</span></div>
          <div class="customer-info">
            <span class="customer-name" id="lookup-name">—</span>
            <span class="customer-phone" id="lookup-phone">—</span>
            <span class="customer-address" id="lookup-address">—</span>
          </div>
        </div>
      </div>

      <!-- Recent Calls -->
      <div class="crm-section">
        <div class="crm-section-header">
          <span class="material-icons-round">history</span>
          <span>So'nggi qo'ng'iroqlar</span>
        </div>
        <div id="dashboard-calls-list" class="crm-section-body">
          <div class="empty-mini">Hozircha qo'ng'iroqlar yo'q</div>
        </div>
      </div>

      <!-- Quick CRM -->
      <div class="crm-section">
        <div class="crm-section-header crm-toggle" onclick="window.CRM.toggleQuickPanel()">
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="material-icons-round">assignment</span>
            <span>Mijoz & Buyurtma</span>
          </div>
          <span class="material-icons-round" id="crm-panel-arrow" style="font-size:18px;transition:transform .25s;">expand_more</span>
        </div>

        <!-- Call Banner -->
        <div id="crm-call-banner" class="crm-banner" style="display:none;">
          <span class="material-icons-round" style="font-size:14px;color:var(--accent);">ring_volume</span>
          <span>Liniya: <strong id="crm-call-line">—</strong></span>
          <span style="opacity:.3;">|</span>
          <span>Raqam: <strong id="crm-call-number">—</strong></span>
        </div>

        <div id="crm-panel-body" class="crm-form" style="display:none;">
          <div class="crm-row">
            <input type="text" id="quick-crm-name" class="crm-input" placeholder="Ism familiya">
            <input type="text" id="quick-crm-phone" class="crm-input" placeholder="+998...">
          </div>
          <input type="text" id="quick-crm-address" class="crm-input" placeholder="Manzil (tuman, ko'cha, uy)">
          <select id="quick-crm-campaign" class="crm-input">
            <option value="">Kampaniya tanlang...</option>
          </select>

          <div class="crm-divider"></div>

          <div class="crm-row">
            <select id="quick-order-product" class="crm-input" style="flex:2;">
              <option value="">Xizmat tanlang</option>
            </select>
            <input type="number" id="quick-order-qty" class="crm-input" placeholder="Soni" min="1" value="1" style="width:72px;">
            <input type="text" id="quick-order-price" class="crm-input" placeholder="Narx" style="width:90px;">
          </div>
          <textarea id="quick-crm-note" class="crm-input" placeholder="Izoh..." rows="2" style="resize:none;"></textarea>

          <div class="crm-row" style="gap:8px;">
            <button class="btn btn-ghost" onclick="window.CRM.saveQuickCustomer()">
              <span class="material-icons-round">person_add</span> Mijoz
            </button>
            <button class="btn btn-accent" onclick="window.CRM.saveQuickOrder()">
              <span class="material-icons-round">shopping_cart</span> Buyurtma
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
