<!-- CHAT TAB - Haydovchilar bilan real-time chat -->
<div class="tab-content" id="tab-chat">

  <!-- LEFT SIDEBAR -->
  <div class="chat-sidebar">
    <div class="chat-sidebar-header">
      <div class="chat-sidebar-title">
        <div class="chat-sidebar-icon">
          <span class="material-icons-round">support_agent</span>
        </div>
        <div style="flex:1; min-width:0;">
          <div class="chat-sidebar-name">Haydovchilar</div>
          <div class="chat-sidebar-sub" id="chat-drivers-count">Yuklanmoqda...</div>
        </div>
        <div id="chat-status-dot" class="chat-online-badge offline" title="Ulanish holati"></div>
      </div>
      <div class="chat-search-wrap">
        <span class="material-icons-round chat-search-icon">search</span>
        <input id="chat-search" type="text" placeholder="Qidirish..." class="chat-search-input">
      </div>
    </div>
    <div id="chat-drivers-list" class="chat-drivers-list">
      <div class="chat-list-loading">
        <span class="material-icons-round">hourglass_empty</span>
        <span>Yuklanmoqda...</span>
      </div>
    </div>
  </div>

  <!-- RIGHT: Chat asosiy qismi -->
  <div class="chat-main">

    <!-- Bo'sh holat -->
    <div id="chat-placeholder" class="chat-placeholder">
      <div class="chat-placeholder-icon">
        <span class="material-icons-round">forum</span>
      </div>
      <div class="chat-placeholder-title">Suhbatni boshlang</div>
      <div class="chat-placeholder-sub">Chap tarafdagi haydovchini tanlang</div>
    </div>

    <!-- Aktiv chat paneli -->
    <div id="chat-panel" class="chat-panel" style="display:none;">

      <!-- Header -->
      <div class="chat-panel-header">
        <div class="chat-panel-avatar" id="chat-panel-avatar">?</div>
        <div class="chat-panel-info">
          <div class="chat-panel-name" id="chat-panel-name">-</div>
          <div class="chat-panel-status" id="chat-panel-role">Haydovchi</div>
        </div>
        <button class="btn-icon" id="btn-close-chat-panel" title="Yopish">
          <span class="material-icons-round">keyboard_arrow_left</span>
        </button>
      </div>

      <!-- Xabarlar -->
      <div id="chat-messages-list" class="chat-messages-list"></div>

      <!-- Input zone: faqat rasm + matn -->
      <div class="chat-input-zone">

        <!-- Toolbar: FAQAT rasm yuborish -->
        <div class="chat-toolbar">
          <button id="chat-btn-image" class="chat-tool-btn" title="Rasm yuborish">
            <span class="material-icons-round">image</span>
            <span class="chat-tool-label">Rasm yuborish</span>
          </button>
        </div>

        <!-- Xabar input + send tugmasi -->
        <div class="chat-input-bottom-row">
          <div class="chat-input-wrap">
            <textarea
              id="chat-input"
              class="chat-textarea"
              rows="1"
              placeholder="Xabar yozing... (Enter — yuborish, Shift+Enter — yangi qator)"
            ></textarea>
          </div>
          <button id="chat-send-btn" class="chat-send-btn" title="Yuborish (Enter)">
            <span class="material-icons-round">send</span>
          </button>
        </div>

      </div>

      <!-- Hidden file input (web fallback) -->
      <input type="file" id="chat-file-input" accept="image/*" style="display:none;">

    </div>
  </div>

</div>

<!-- Rasm kattalashtirish modali -->
<div id="chat-image-modal" class="chat-image-modal" style="display:none;" onclick="this.style.display='none'">
  <button class="chat-image-modal-close" onclick="document.getElementById('chat-image-modal').style.display='none'">
    <span class="material-icons-round">close</span>
  </button>
  <img id="chat-image-modal-img" src="" alt="Rasm" class="chat-image-modal-img">
</div>

<!-- Lokatsiyani mijozga biriktirish modali -->
<div id="chat-attach-modal" class="chat-map-modal" style="display:none;">
  <div class="chat-map-modal-box" style="max-width:480px; height:auto; max-height:80vh;">
    <div class="chat-map-modal-header">
      <span class="material-icons-round" style="color:var(--accent)">person_pin_circle</span>
      <span>Mijozga buyurtma manzilini biriktirish</span>
      <button class="btn-icon" id="chat-attach-close">
        <span class="material-icons-round">close</span>
      </button>
    </div>

    <!-- Lokatsiya preview -->
    <div id="chat-attach-preview" style="padding:12px 16px; border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);">
        <span class="material-icons-round" style="color:var(--accent);font-size:18px;">location_on</span>
        <span id="chat-attach-coords">-</span>
        <a id="chat-attach-gmaps" href="#" target="_blank" style="color:var(--accent);font-size:11px;margin-left:auto;">
          Google Maps ↗
        </a>
      </div>
    </div>

    <!-- Mijoz qidirish -->
    <div style="padding:12px 16px 8px;">
      <div style="position:relative;">
        <span class="material-icons-round" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text-secondary);">search</span>
        <input id="chat-attach-search" type="text" placeholder="Mijoz ismi yoki raqami..."
          style="width:100%;padding:9px 12px 9px 36px;background:var(--bg-0);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:13px;box-sizing:border-box;">
      </div>
    </div>

    <!-- Mijozlar ro'yxati -->
    <div id="chat-attach-customers-list"
      style="overflow-y:auto;max-height:300px;padding:0 8px 8px;">
      <div style="text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;">
        Yuklanmoqda...
      </div>
    </div>

    <div class="chat-map-modal-footer" style="padding:12px 16px;">
      <div id="chat-attach-status" style="font-size:12px;color:var(--text-secondary);"></div>
      <button id="chat-attach-confirm" class="btn-primary" disabled>
        <span class="material-icons-round">check</span> Biriktirish
      </button>
    </div>
  </div>
</div>
